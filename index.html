const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ac(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt)}
async function dene(pw,hatirla){try{const h=await ac(pw);if(hatirla){try{localStorage.setItem('kxp',pw)}catch(e){}}document.open();document.write(h);document.close();return true}catch(e){return false}}
(async()=>{let s=null;try{s=localStorage.getItem('kxp')}catch(e){}if(s&&!(await dene(s,false))){try{localStorage.removeItem('kxp')}catch(e){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('b');b.textContent='Açılıyor…';
 if(!(await dene(document.getElementById('p').value.trim(),document.getElementById('r').checked))){b.textContent='Aç';document.getElementById('e').style.display='block'}});
